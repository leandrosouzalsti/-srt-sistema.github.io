<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRT Motors - Setor de Recrutamento</title>
    <meta name="description" content="Sub-menu de gestão e formulários do setor de recrutamento.">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="form-wrapper" style="max-width: 650px;">
        <a href="../index.html" class="btn-voltar" style="text-decoration: none;" id="btn-back-main">⬅️ Menu Principal</a>
        
        <div class="form-container" style="text-align: center;">
            <h1 style="display:none;">Setor de Recrutamento</h1>
            <h2>Setor de Recrutamento</h2>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 30px;">Selecione a ação ou formulário correspondente:</p>
            
            <nav class="grid-categorias" style="grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px;">
                <a href="iniciante.html" style="text-decoration: none;" id="link-rec-iniciante">
                    <div class="card-categoria" style="padding: 25px 15px;">
                        <div class="icon">🌱</div>
                        <div class="title" style="font-size: 12px;">Iniciante</div>
                    </div>
                </a>
                <a href="nao-iniciante.html" style="text-decoration: none;" id="link-rec-nao-iniciante">
                    <div class="card-categoria" style="padding: 25px 15px;">
                        <div class="icon">⚡</div>
                        <div class="title" style="font-size: 12px;">Não Iniciante</div>
                    </div>
                </a>
                <a href="novos-recrutadores.html" style="text-decoration: none;" id="link-novos-recrutadores">
                    <div class="card-categoria" style="padding: 25px 15px;">
                        <div class="icon">🎖️</div>
                        <div class="title" style="font-size: 12px;">Novos Recrutadores</div>
                    </div>
                </a>
                <a href="ausencia.html" style="text-decoration: none;" id="link-ausencia-recrutador">
                    <div class="card-categoria" style="padding: 25px 15px;">
                        <div class="icon">💤</div>
                        <div class="title" style="font-size: 12px;">Aviso de Ausência</div>
                    </div>
                </a>
            </nav>
        </div>
    </div>

    <!-- Toast container for notifications -->
    <div id="toast-container"></div>

    <script src="../js/main.js"></script>
</body>
</html>
